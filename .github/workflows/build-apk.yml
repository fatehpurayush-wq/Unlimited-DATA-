name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VER_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VER_OUTPUT"

          VERSION_STRING="$(printf '%s\n' "$JAVA_VER_OUTPUT" | head -n 1 | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [ -z "$VERSION_STRING" ]; then
            echo "::error::Failed to detect active Java version."
            exit 1
          fi

          if [[ "$VERSION_STRING" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "$VERSION_STRING" | cut -d'.' -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "$VERSION_STRING" | cut -d'.' -f1)"
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from '$VERSION_STRING'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Temporary ./debug.keystore already exists; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to verify ./debug.keystore after generation."
            exit 1
          fi
          echo "Verified temporary ./debug.keystore exists for debug signing."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have the .apk extension."
            exit 1
          fi

          APK_BYTES="$(wc -c < "$EXPECTED_APK" | tr -d '[:space:]')"
          echo "Verified debug APK: $EXPECTED_APK ($APK_BYTES bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing at $SOURCE_APK"
            exit 1
          fi

          RAW_REPO="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO="$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset.XXXXXX")"
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed for $ASSET_PATH"
            exit 1
          fi

          {
            echo "asset_path=$ASSET_PATH"
            echo "asset_filename=$ASSET_FILENAME"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_FILENAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release APK asset is missing or invalid."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_title=$RELEASE_TITLE"
          } >> "$GITHUB_OUTPUT"

          RELEASE_NOTES="$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Build Purpose:** Testing only — not a Google Play Store production release.
          - **Signing:** Signed only with a temporary runner-generated debug keystore.
          EOF
          )"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare_asset.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$UPLOAD_OUTCOME" != "success" ] || [ "$PREPARE_OUTCOME" != "success" ]; then
            echo "APK build or artifact upload did not complete; skipping release summary."
            exit 0
          fi

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_FILENAME"

            {
              echo "### Debug APK Build & GitHub Release Published"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Asset:** \`${ASSET_FILENAME}\`"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above. The GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available for download."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the GitHub Release failed, so no release URL was created."
              echo ""
              echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Download:** Download the \`app-debug-apk\` artifact from this GitHub Actions workflow run's **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
